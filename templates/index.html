<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Thanh chuyển đổi 2 chế độ: Chế độ Chat | Chế độ Nói -->
  <nav class="mode-switcher" aria-label="Chế độ tương tác">
    <button type="button" id="modeChatBtn" class="mode-tab active" data-mode="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Chế độ Chat</span>
    </button>
    <button type="button" id="modeVoiceBtn" class="mode-tab" data-mode="voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" x2="12" y1="19" y2="22"></line>
      </svg>
      <span>Chế độ Nói</span>
    </button>
  </nav>

  <button type="button" id="themeToggleBtn" class="theme-corner-btn" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện Sáng / Tối">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="split-layout" id="appLayout" data-mode="chat">
    <!-- CỘT TRÁI (HOẶC TOÀN MÀN HÌNH KHI Ở CHẾ ĐỘ NÓI): THINKING ORB CỦA WISP -->
    <aside class="orb-pane">
      <section class="orb-stage">
        <div class="orb-canvas-wrap" id="orbModeBtn" title="Bấm để đổi trạng thái của Wisp">
          <canvas id="centerOrb" width="460" height="460" aria-label="Wisp Thinking Orb"></canvas>
        </div>

        <div class="wisp-title">Wisp</div>

        <div id="typingIndicator" class="orb-status" aria-live="polite">
          <span id="typingText" class="orb-status-text visible">Sẵn sàng</span>
        </div>

        <!-- Phụ đề trực tiếp & Sóng âm thanh trực tiếp (hiển thị trong Chế độ Nói) -->
        <div class="voice-overlay" id="voiceOverlay" aria-live="polite">
          <div class="voice-wave-wrap" id="voiceWaveWrap" title="Chạm để ngắt lời hoặc tạm dừng">
            <canvas id="voiceWaveCanvas" width="360" height="64" aria-label="Sóng âm thanh trực tiếp"></canvas>
          </div>
          <p id="voiceTranscript" class="voice-transcript muted">Hãy nói gì đó với Wisp…</p>
        </div>
      </section>
    </aside>

    <!-- CỘT PHẢI: KHUNG HIỂN THỊ CHAT & Ô NHẬP CHAT -->
    <section class="chat-pane">
      <main id="chat" class="chat-messages" aria-live="polite"></main>

      <div class="composer-wrapper">
        <footer class="chat-input-area">
          <input
            type="text"
            id="msg"
            class="chat-input"
            placeholder="Nhắn cho Wisp..."
            autocomplete="off"
            autofocus
          >
          <button type="button" id="quickVoiceBtn" class="voice-quick-btn" title="Chuyển sang Chế độ Nói" aria-label="Chuyển sang Chế độ Nói">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10v3"></path>
              <path d="M6 6v11"></path>
              <path d="M10 3v18"></path>
              <path d="M14 8v7"></path>
              <path d="M18 5v13"></path>
              <path d="M22 10v3"></path>
            </svg>
          </button>
          <button type="button" id="sendBtn" class="send-btn" aria-label="Gửi">
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"></path>
              <path d="m5 12 7-7 7 7"></path>
            </svg>
          </button>
        </footer>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
